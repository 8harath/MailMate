[project]
name = "mailmate-agent-service"
version = "0.1.0"
description = "LangGraph-powered multi-agent orchestration service for MailMate"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "structlog>=25.1",
]

[project.optional-dependencies]
prod = [
    "langgraph>=0.3",
    "langgraph-checkpoint-postgres>=0.1",
    "langchain-groq>=0.3",
    "langchain-core>=0.3",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.2",
    "opentelemetry-sdk>=1.31",
    "opentelemetry-exporter-otlp>=1.31",
    "sentry-sdk[fastapi]>=2.20",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "httpx>=0.28",
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends.legacy:build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
