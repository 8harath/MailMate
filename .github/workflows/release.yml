name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/mailmate-web
  AGENT_IMAGE: ghcr.io/${{ github.repository_owner }}/mailmate-agent

jobs:
  release:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta-web
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/metadata-action@v5
        id: meta-agent
        with:
          images: ${{ env.AGENT_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v5
        with:
          context: submissions/61-Avalon
          target: runner
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}

      - uses: docker/build-push-action@v5
        with:
          context: agent-service
          push: true
          tags: ${{ steps.meta-agent.outputs.tags }}
